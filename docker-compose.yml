services:
  katzen-analyzer:
    image: nginx:alpine
    container_name: katzen-analyzer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8300:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./kater.jpg:/usr/share/nginx/html/kater.jpg:ro
      - ./service-worker.js:/usr/share/nginx/html/service-worker.js:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      katzen-proxy:
        condition: service_healthy
    networks:
      - katzen-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  katzen-proxy:
    build: ./proxy
    container_name: katzen-proxy
    restart: unless-stopped
    networks:
      - katzen-net
    security_opt:
      - no-new-privileges:true
    read_only: true                 # F5: kein Schreibzugriff aufs Dateisystem nötig
    cap_drop:
      - ALL                         # F5: keine Linux-Capabilities nötig
    mem_limit: 128m
    cpus: 0.5
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

networks:
  katzen-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
          gateway: 172.16.0.1
