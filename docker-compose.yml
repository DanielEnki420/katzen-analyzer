services:
  katzen-analyzer:
    image: nginx:alpine
    container_name: katzen-analyzer
    restart: unless-stopped
    ports:
      - "8300:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./kater.jpg:/usr/share/nginx/html/kater.jpg:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - katzen-proxy
    networks:
      - katzen-net
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  katzen-proxy:
    build: ./proxy
    container_name: katzen-proxy
    restart: unless-stopped
    networks:
      - katzen-net
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"

networks:
  katzen-net:
    driver: bridge
