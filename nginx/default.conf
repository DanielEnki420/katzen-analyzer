server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;                       # F6: keine nginx-Version im Header

    # --- Security-Header (F4) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    # CSP: Inline-Script/Style nötig (Single-File-App). connect-src 'self' verhindert,
    # dass ein evtl. XSS den API-Key an eine fremde Domain exfiltriert (Defense-in-Depth).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Statische Dateien
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Proxy zu Anthropic (via interner katzen-proxy Container)
    location /api/anthropic/ {
        client_max_body_size 256k;           # F2: Body-Limit auch auf nginx-Ebene
        rewrite ^/api/anthropic/(.*)$ /$1 break;
        proxy_pass http://katzen-proxy:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
